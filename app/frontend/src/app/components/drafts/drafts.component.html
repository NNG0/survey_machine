<div class="drafts-container">
  <div class="drafts-header">
    <h2><i class="fas fa-file-alt"></i> Drafts</h2>
    <p class="subtitle">Your in-progress drafts</p>
  </div>

  <div class="drafts-content" *ngIf="drafts.length > 0; else emptyState">
    <div class="paper-card" *ngFor="let d of drafts">
      <div class="paper-header">
        <div class="paper-title">
          <h3>{{ d.title }}</h3>
          <p class="meta">
            <i class="fas fa-clock"></i> Created {{ d.createdAt | date:'dd.MM.yyyy HH:mm' }} • Updated {{ d.updatedAt | date:'dd.MM.yyyy HH:mm' }}
          </p>
        </div>
        <div class="paper-actions">
          <button class="remove-btn" (click)="deleteDraft(d.id)" title="Aus Sammlung entfernen">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="tags" *ngIf="d.keywords?.length">
        <span *ngFor="let k of d.keywords" class="tag">{{ k }}</span>
      </div>

      <div class="saved-info">
        <button class="btn view-edit" [disabled]="d.status !== 'ready'" (click)="openPreviewMarkdown(d)">
          <i class="fas fa-eye"></i> {{ d.status === 'ready' ? 'View/Edit' : 'Loading…' }}
        </button>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <i class="fas fa-file-alt fa-3x"></i>
      <h3>No drafts yet</h3>
      <p>Start drafting from the Collection to see drafts here.</p>
    </div>
  </ng-template>
</div>

<div class="modal-backdrop" *ngIf="showPreview" (click)="closePreview()"></div>
<div class="modal" *ngIf="showPreview">
  <div class="modal-header">
    <h3>Draft preview</h3>
    <button class="close-btn" (click)="closePreview()">×</button>
  </div>
  <pre class="markdown">{{ previewMarkdown }}</pre>
</div>
