<div class="drafts-container">
  <div class="drafts-header">
    <h2><i class="fas fa-file-alt"></i> Projects</h2>
    <p class="subtitle">⑤ Manage your projects, edit them and save them. </p>
  </div>

  <div class="drafts-content" *ngIf="drafts.length > 0; else emptyState">
    <div class="list-toolbar">
      <div class="sort-controls">
        <label for="sortSelect">Sort by:</label>
        <select id="sortSelect" [(ngModel)]="sortOrder" (change)="onSortChange()">
          <option value="dateDesc">Date (newest first)</option>
          <option value="dateAsc">Date (oldest first)</option>
          <option value="alphabetical">Alphabetical</option>
        </select>
      </div>
    </div>
    <div class="paper-card" *ngFor="let d of drafts">
      <div class="paper-header">
        <div class="paper-title">
          <h3>{{ d.title }}</h3>
          <p class="meta">
            <i class="fas fa-clock"></i> Created {{ d.createdAt | date:'dd.MM.yyyy HH:mm' }} • Updated {{ d.updatedAt |
            date:'dd.MM.yyyy HH:mm' }}
          </p>
        </div>
        <div class="paper-actions">
          <button class="remove-btn" (click)="deleteDraft(d.id)" title="Aus Sammlung entfernen">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="tags" *ngIf="d.keywords?.length">
        <span *ngFor="let k of d.keywords" class="tag">{{ k }}</span>
      </div>

      <div class="saved-info">
        <button class="btn view-edit" (click)="openPreviewMarkdown(d)" *ngIf="d.markdown">
          <i class="fas fa-eye"></i> View
        </button>
        <button class="btn view-edit" *ngIf="!d.markdown" disabled title="No preview available">
          <i class="fas fa-eye-slash"></i> View
        </button>
        <button class="btn edit-btn" [routerLink]="['/drafts', d.id]" target="_blank">
          <i class="fas fa-edit"></i> Edit
        </button>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <i class="fas fa-file-alt fa-3x"></i>
      <h3>No projects yet</h3>
      <p>Start drafting from the Collection to see projects here.</p>
    </div>
  </ng-template>
</div>

<div class="modal-backdrop" *ngIf="showPreview" (click)="closePreview()"></div>
<div class="modal" *ngIf="showPreview">
  <div class="modal-header">
    <h3>Project Draft preview</h3>
    <div class="header-actions">
      <button class="close-btn" (click)="closePreview()">×</button>
    </div>
  </div>
  <div class="modal-body">
    <div class="markdown" *ngIf="previewMarkdown" [innerHTML]="previewMarkdown"></div>
  </div>
</div>
