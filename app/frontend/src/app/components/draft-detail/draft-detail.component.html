<div class="draft-detail" *ngIf="draft; else notFound">
  <div class="draft-card">
    <div class="draft-header">
      <div class="draft-title">
        <h2><i class="fas fa-file-alt"></i> {{ draft.title }}</h2>
        <p class="meta">
          <i class="fas fa-clock"></i>
          Created {{ draft.createdAt | date:'dd.MM.yyyy HH:mm' }} • Updated {{ draft.updatedAt | date:'dd.MM.yyyy HH:mm' }}
        </p>
      </div>
      <div class="draft-actions">
        <button class="remove-btn" (click)="delete()" title="Delete draft">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="form-section">
      <label for="title">Title</label>
      <input id="title" type="text" [(ngModel)]="titleEdit" />
      <a class="btn primary" [routerLink]="['/drafts', draft.id]" target="_blank" rel="noopener">
        <i class="fas fa-eye"></i> View
      </a>
      <a routerLink="/drafts" class="btn">Back to drafts</a>
    </div>

    <div class="tags" *ngIf="draft.keywords?.length">
      <span class="tag" *ngFor="let k of draft.keywords">{{ k }}</span>
    </div>
  </div>
</div>

<ng-template #notFound>
  <div class="empty-state">
    <h3>Draft not found</h3>
    <a routerLink="/drafts" class="btn">Back to drafts</a>
  </div>
</ng-template>
