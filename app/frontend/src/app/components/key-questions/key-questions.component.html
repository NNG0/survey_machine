<div class="key-questions">
  <h2>
    Key Questions
  </h2>
  <ol>
    @for (question of appState.currentStep.status.key_questions; track question) {
      <li class="card">{{question}}</li>
    }
  </ol>
  <button (click)="triggerLiteratureSearch()">
    <p>search for literature</p>
  </button>
</div>
